# Deploys the Cloudflare Worker from GitHub, so no local machine is needed.
# Runs on demand, and on pushes to master that change the Worker or the shared code.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions → Secrets):
#   CLOUDFLARE_API_TOKEN   an API token limited to this account's Workers Scripts and D1 (Edit)
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account id
# Until they are set, the deploy job is skipped and the run still passes.
name: Deploy Worker

on:
  push:
    branches: [master]
    paths: ['worker/**', 'shared/**', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Skip until the Cloudflare secrets are set
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets are not set; skipping the Worker deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.ready.outputs.ok == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.ready.outputs.ok == 'true'
        run: npm ci

      # The database is found by its name, and created on the first run. Its id is written
      # into the config only for this run, so nothing has to be committed.
      - name: Find or create the D1 database
        if: steps.ready.outputs.ok == 'true'
        run: node scripts/ensure-d1.ts douze worker/wrangler.jsonc

      # Append-only migrations (worker/migrations/), applied before the code that needs them.
      - name: Apply the database migrations
        if: steps.ready.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply DB --remote --config worker/wrangler.jsonc

      # The archive as a standard group (worker/seed/archive.sql, from src/data/). Every
      # statement is INSERT OR IGNORE, so this changes nothing that exists. The owner's name in
      # it is given to the Google account with the email in the secret ARCHIVE_OWNER_EMAIL, the
      # first time that account signs in; without the secret, the seed waits.
      - name: Seed the archive group
        if: steps.ready.outputs.ok == 'true'
        env:
          ARCHIVE_OWNER_EMAIL: ${{ secrets.ARCHIVE_OWNER_EMAIL }}
        run: |
          email=$(printf '%s' "$ARCHIVE_OWNER_EMAIL" | tr 'A-Z' 'a-z')
          if ! printf '%s' "$email" | grep -Eq '^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$'; then
            echo "::notice::ARCHIVE_OWNER_EMAIL is not set; the archive group is not seeded."
            exit 0
          fi
          sed "s/__OWNER_EMAIL__/$email/" worker/seed/archive.sql > "$RUNNER_TEMP/archive.sql"
          npx wrangler d1 execute DB --remote --file "$RUNNER_TEMP/archive.sql" --config worker/wrangler.jsonc

      - name: Deploy
        if: steps.ready.outputs.ok == 'true'
        run: npx wrangler deploy --config worker/wrangler.jsonc | tee deploy.log

      # Google sign-in: the OAuth client's id and secret become secrets of the Worker (never
      # in the repository, never in a log). Without them, sign-in is off and says so.
      - name: Set the Google sign-in secrets
        if: steps.ready.outputs.ok == 'true'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "::notice::GOOGLE_CLIENT_ID or GOOGLE_CLIENT_SECRET is not set; sign-in stays off."
            exit 0
          fi
          printf '%s' "$GOOGLE_CLIENT_ID" | npx wrangler secret put GOOGLE_CLIENT_ID --config worker/wrangler.jsonc
          printf '%s' "$GOOGLE_CLIENT_SECRET" | npx wrangler secret put GOOGLE_CLIENT_SECRET --config worker/wrangler.jsonc

      # The Worker answers on its health address: a deploy that does not is a failed deploy.
      - name: Check the Worker answers
        if: steps.ready.outputs.ok == 'true'
        run: |
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -n 1)
          if [ -z "$url" ]; then
            echo "::error::The deploy log has no workers.dev address."
            exit 1
          fi
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "$url/health" | grep -q '"ok":true'; then
              {
                echo "### Worker deployed"
                echo
                echo "Address: \`$url\`"
                echo
                echo "Put it in the repository variable \`API_URL\`, then the site can call it."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$url/health did not answer."
          exit 1
