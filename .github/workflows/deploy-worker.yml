# Deploys the Cloudflare Worker from GitHub, so no local machine is needed.
# Runs on demand, and on pushes to master that change the Worker or the shared code.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions → Secrets):
#   CLOUDFLARE_API_TOKEN   an API token limited to this project's Worker (and, later, its D1)
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account id
# Until they are set, the deploy job is skipped and the run still passes.
name: Deploy Worker

on:
  push:
    branches: [master]
    paths: ['worker/**', 'shared/**', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Skip until the Cloudflare secrets are set
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets are not set; skipping the Worker deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.ready.outputs.ok == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.ready.outputs.ok == 'true'
        run: npm ci

      - name: Deploy
        if: steps.ready.outputs.ok == 'true'
        run: npx wrangler deploy --config worker/wrangler.jsonc | tee deploy.log

      # The Worker answers on its health address: a deploy that does not is a failed deploy.
      - name: Check the Worker answers
        if: steps.ready.outputs.ok == 'true'
        run: |
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -n 1)
          if [ -z "$url" ]; then
            echo "::error::The deploy log has no workers.dev address."
            exit 1
          fi
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "$url/health" | grep -q '"ok":true'; then
              {
                echo "### Worker deployed"
                echo
                echo "Address: \`$url\`"
                echo
                echo "Put it in the repository variable \`API_URL\`, then the site can call it."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$url/health did not answer."
          exit 1
